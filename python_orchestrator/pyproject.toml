[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webcmd"
version = "0.1.0"
description = "Intent-driven, state-aware, self-healing workflow runtime for the web"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer[all]>=0.9.0",
    "rich>=13.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.0",
    "keyring>=24.0",
    "playwright>=1.40.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]
agent = [
    "browser-use>=0.1.0",
    "openai>=1.0",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
]

[project.scripts]
webcmd = "webcmd.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/webcmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
